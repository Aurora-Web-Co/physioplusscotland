<footer id="cs-footer">
  <div class="cs-container">
    <div class="cs-logo-group">
      <a aria-label="go back to home" class="cs-logo" href="/">
        <img
          class="cs-logo-img"
          aria-hidden="true"
          loading="lazy"
          decoding="async"
          src="/assets/svgs/logo.jpg"
          alt="{{ client.name }} logo"
          width="180"
          height="40"
        />
      </a>
    </div>
    <ul class="cs-nav">
      <li class="cs-nav-li">
        <span class="cs-header">Sitemap</span>
      </li>
      <li class="cs-nav-li"><a class="cs-nav-link" href="/">Home</a></li>
    </ul>
    <ul class="cs-contact">
      <li class="cs-nav-li">
        <span class="cs-header">Contact</span>
      </li>
      <li class="cs-contact-li">
        <a class="cs-contact-link" href="mailto:{{ client.email }}"
          >{{ client.email }}</a
        >
      </li>
      {% if client.phoneFormatted %}
      <li class="cs-contact-li">
        <a class="cs-contact-link" href="tel:{{ client.phoneForTel }}"
          >{{ client.phoneFormatted }}</a
        >
      </li>
      {% endif %}
    </ul>
  </div>
  <p class="cs-copyright">
    © {% year %} {{ client.name }}. All rights reserved.
  </p>
</footer>
